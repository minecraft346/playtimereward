name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compiler
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: PlaytimeRewards
          path: target/PlaytimeRewards.jar
