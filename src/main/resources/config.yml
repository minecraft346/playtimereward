# ============================================================
#  PlaytimeRewards - configuration
# ============================================================
# Formats de temps : 30s, 15m, 2h, 1d, 1d12h30m ...
# (un nombre seul est compté en MINUTES)

# Temps d'inactivité (en secondes) après lequel un joueur est AFK
# et ne gagne plus de temps de jeu. Mettre 0 pour désactiver l'anti-AFK.
afk-timeout-seconds: 300

# true  = les récompenses sont données automatiquement dès qu'elles sont débloquées
# false = le joueur doit les récupérer dans /playtime rewards
auto-claim: false

# Shards : monnaie gagnée automatiquement avec le temps de jeu actif
# (même compteur que les récompenses, donc l'anti-AFK s'applique aussi).
# Le joueur gagne "amount" shard(s) toutes les "interval" de temps de jeu.
shards:
  interval: 5m
  amount: 1
  notify: true

gui:
  title: "&8Récompenses &7- &aTemps de jeu"
  info-name: "&eTon temps de jeu"
  claim-all-name: "&aTout récupérer"
  claimed-material: LIME_STAINED_GLASS_PANE

# Variables dans les commandes : %player% = nom du joueur
# Les commandes sont exécutées par la console.
rewards:
  30min:
    time: 30m
    name: "&a30 minutes"
    icon: COOKIE
    description:
      - "&7Un petit bonus pour bien commencer."
    commands:
      - "give %player% bread 16"
      - "eco give %player% 500"

  1h:
    time: 1h
    name: "&a1 heure"
    icon: IRON_INGOT
    description:
      - "&7Tu commences à prendre tes marques."
    commands:
      - "give %player% iron_ingot 16"
      - "eco give %player% 1000"
      - "shards give %player% 5"

  3h:
    time: 3h
    name: "&b3 heures"
    icon: GOLDEN_APPLE
    description:
      - "&7Un vrai joueur régulier !"
    commands:
      - "give %player% golden_apple 5"
      - "eco give %player% 3000"

  6h:
    time: 6h
    name: "&b6 heures"
    icon: DIAMOND
    description:
      - "&7Des diamants bien mérités."
    commands:
      - "give %player% diamond 8"
      - "eco give %player% 6000"
      - "shards give %player% 20"

  12h:
    time: 12h
    name: "&d12 heures"
    icon: EXPERIENCE_BOTTLE
    description:
      - "&7De l'expérience en quantité."
    commands:
      - "give %player% experience_bottle 32"
      - "eco give %player% 12000"

  1d:
    time: 1d
    name: "&d1 jour"
    icon: ENDER_PEARL
    description:
      - "&724 heures passées sur le serveur !"
    commands:
      - "give %player% ender_pearl 8"
      - "give %player% diamond 16"
      - "eco give %player% 25000"
      - "shards give %player% 50"

  3d:
    time: 3d
    name: "&63 jours"
    icon: NETHERITE_INGOT
    description:
      - "&7Tu fais partie des piliers du serveur."
    commands:
      - "give %player% netherite_ingot 2"
      - "eco give %player% 75000"

  7d:
    time: 7d
    name: "&c&l7 jours"
    icon: NETHER_STAR
    description:
      - "&7Une semaine complète de jeu. Respect !"
    commands:
      - "give %player% netherite_ingot 5"
      - "give %player% totem_of_undying 1"
      - "eco give %player% 200000"
      - "shards give %player% 200"
      - "broadcast &6%player% &ea atteint &c7 jours &ede temps de jeu !"

